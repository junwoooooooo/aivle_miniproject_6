spring:
  application:
    name: backend


  # 로컬 dev: 기본값(H2). 배포: 환경변수(RDS MySQL)로 주입 — k8s Secret 사용.
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/bookdb}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:1234}


  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


server:
  port: 8080

jwt:
  secret: aivle-bookmanager-secret-key-must-be-long-enough-256bit
  expiration: 86400000