# ⚠️ 이 파일은 "예시"입니다. 실제 비밀번호를 여기 넣어 커밋하지 마세요! (공개 레포)
#
# 실제 Secret은 아래 명령으로 클러스터에 직접 생성하세요 (커밋되지 않음):
#
#   kubectl create secret generic db-secret \
#     --from-literal=DB_URL="jdbc:mysql://<RDS엔드포인트>:3306/bookdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC" \
#     --from-literal=DB_DRIVER="com.mysql.cj.jdbc.Driver" \
#     --from-literal=DB_USERNAME="admin" \
#     --from-literal=DB_PASSWORD="<RDS비밀번호>"
#
# 확인: kubectl get secret db-secret -o yaml
#
# 아래는 매니페스트로 만들고 싶을 때의 형태(값은 더미). 쓰려면 복사해서 db-secret.yaml로 만들고
# 실제 값을 채운 뒤 git에 올리지 말 것(.gitignore에 db-secret.yaml 등록됨).
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
type: Opaque
stringData:
  DB_URL: "jdbc:mysql://CHANGE_ME-rds-endpoint:3306/bookdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
  DB_DRIVER: "com.mysql.cj.jdbc.Driver"
  DB_USERNAME: "admin"
  DB_PASSWORD: "CHANGE_ME"
