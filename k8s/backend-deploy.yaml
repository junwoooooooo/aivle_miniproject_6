apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 1  # H2 단계 임시: 파드 1개(데이터 일관성). RDS 전환 후 2로 + HPA 복구
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # AWS ECR에 등록될 내 백엔드 도커 이미지 주소
          image: 416225317325.dkr.ecr.us-east-1.amazonaws.com/backend:latest
          ports:
            - containerPort: 8080
          # RDS 접속정보를 Secret(db-secret)에서 주입 (DB_URL/DB_DRIVER/DB_USERNAME/DB_PASSWORD)
          # optional:true → secret 없으면(H2 단계) 무시하고 application.yaml 기본값(H2)로 동작
          envFrom:
            - secretRef:
                name: db-secret
                optional: true
          resources:
            requests:
              cpu: "200m" # 오토스케일링 기준 측정을 위한 CPU 기본 할당량
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: ClusterIP  # 프론트엔드만 접근하면 되므로 내부 IP로 은닉
  selector:
    app: backend
  ports:
    - port: 8080       # nginx가 backend-service:8080 으로 호출하므로 서비스 포트도 8080
      targetPort: 8080
# ---
# H2 단계에서는 HPA 비활성화 (단일 파드 유지 위해). RDS 전환 후 아래 주석 해제.
